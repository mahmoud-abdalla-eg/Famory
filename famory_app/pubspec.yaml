name: one_famory
description: A premium family coordination app

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  # MOVED HERE: These are required for the app to run
  get: ^4.6.5
  shared_preferences: ^2.2.2
  image_picker: ^1.1.2
  emoji_picker_flutter: ^4.4.0
  file_picker: ^11.0.2
  crypto: ^3.0.7
  just_audio: ^0.10.5
  path_provider: ^2.1.5
  qr_flutter: ^4.1.0
  record: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - translation/en/translations.json
    - translation/ar/translations.json
    - translation/cn/translations.json
    - .env

  fonts:
    - family: Araboto
      fonts:
        - asset: assets/fonts/Araboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Araboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Araboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Araboto-Black.ttf
          weight: 900
